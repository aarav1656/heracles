[package]
name = "heracles-pricer"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = { version = "1.5.7", default-features = false }
stylus-sdk = "0.10.9"
pricer-core = { path = "core" }

[lib]
name = "pricer"
crate-type = ["lib", "cdylib"]

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]

[dev-dependencies]
stylus-sdk = { version = "0.10.9", features = ["stylus-test"] }

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"
